<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Submission Runway</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0E5A54">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,100..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F1F4F2; --surface:#FBFCFB; --surface-2:#E7EDEA; --sunk:#E2E9E6;
  --ink:#111917; --ink-2:#3E504C; --muted:#6B7C77;
  --rule:#D3DCD8; --rule-strong:#B9C7C2;
  --accent:#0E5A54; --accent-ink:#0A423E; --accent-soft:#D8E9E6;
  --hot:#9B2226; --hot-soft:#F4DFDE;
  --warm:#8A5410;
  --cool:#5F716C;
  --gold:#7A5B00; --gold-soft:#F0E7CC; --gold-line:#C9A94A;
  --kr:#42527E; --kr-soft:#E4E8F3; --kr-line:#98A5C6;
  --card:#FFFFFF; --card-2:#EFF3F1; --card-edge:rgba(17,25,23,.10);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B100F; --surface:#131A19; --surface-2:#1B2422; --sunk:#0E1413;
  --ink:#E6EDEA; --ink-2:#B2C2BD; --muted:#7E918C;
  --rule:#283432; --rule-strong:#3A4A47;
  --accent:#58C4B6; --accent-ink:#8FDCD1; --accent-soft:#16302D;
  --hot:#F08078; --hot-soft:#3A1E1D;
  --warm:#D9A961;
  --cool:#8C9E99;
  --gold:#E0C075; --gold-soft:#2E2711; --gold-line:#7A6532;
  --kr:#A7B4E0; --kr-soft:#1B2138; --kr-line:#454F76;
  --card:#202A28; --card-2:#151D1C; --card-edge:rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0B100F; --surface:#131A19; --surface-2:#1B2422; --sunk:#0E1413;
  --ink:#E6EDEA; --ink-2:#B2C2BD; --muted:#7E918C;
  --rule:#283432; --rule-strong:#3A4A47;
  --accent:#58C4B6; --accent-ink:#8FDCD1; --accent-soft:#16302D;
  --hot:#F08078; --hot-soft:#3A1E1D;
  --warm:#D9A961;
  --cool:#8C9E99;
  --gold:#E0C075; --gold-soft:#2E2711; --gold-line:#7A6532;
  --kr:#A7B4E0; --kr-soft:#1B2138; --kr-line:#454F76;
  --card:#202A28; --card-2:#151D1C; --card-edge:rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--display); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.app{max-width:520px;margin:0 auto;padding:10px 12px 28px;display:flex;flex-direction:column;gap:12px}

/* ── 상단 바 ─────────────────────────── */
.bar{display:flex;align-items:center;gap:10px;padding:2px 2px 0}
.brand{
  font-variation-settings:"wdth" 118,"wght" 720; font-size:.82rem;
  letter-spacing:.02em; color:var(--ink-2); white-space:nowrap;
}
.bar .sp{flex:1}
.today{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.01em;
  font-variant-numeric:tabular-nums;margin-right:2px}
.today b{color:var(--ink-2);font-weight:600}
/* 날짜 뒤 요일 */
.hero .who .when i{font-style:normal;color:var(--muted);font-size:.88em}
.slot .sub i{font-style:normal;color:var(--muted);font-size:.92em}
ul.all .t .d i{font-style:normal;color:var(--muted)}
.iconbtn{
  width:26px;height:26px;border-radius:5px;display:grid;place-items:center;
  color:var(--muted);font-size:.9rem;
}
.iconbtn:hover{background:var(--surface-2);color:var(--accent)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

/* ── 플립 ────────────────────────────── */
.flipset{display:inline-flex;align-items:stretch;gap:2px}
.flipset .sep{
  display:flex;align-items:center;font-family:var(--mono);font-weight:700;
  color:var(--muted);padding:0 1px;
}
/* 종이 한 장이 넘어가는 느낌: 접히는 면을 따라 도는 음영 + 카드 두께 + 힌지 자국 */
.fd{
  position:relative; display:block; perspective:calc(var(--fh) * 3.2);
  width:var(--fw); height:var(--fh);
  font-family:var(--mono); font-weight:700; font-size:var(--fs);
  font-variant-numeric:tabular-nums;
  /* filter/opacity/mask 를 여기 주면 3D 렌더링 컨텍스트가 평면화되어
     rotateX 가 적용돼도 원근이 사라진다. 두께감은 box-shadow 로만 낸다. */
}
.fd .c{
  position:absolute;left:0;right:0;height:calc(var(--fh) / 2);overflow:hidden;
  color:var(--fc,var(--ink));
  box-shadow:0 0 0 1px var(--card-edge), 0 1px 2px rgba(0,0,0,.32);
}
.fd .c > b{
  display:block;height:var(--fh);line-height:var(--fh);text-align:center;font-weight:inherit;
}
.fd .c > s{                                  /* 회전에 따라 짙어지는 음영 판 */
  position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;
}
.fd .t,.fd .tf{
  top:0;border-radius:4px 4px 0 0;
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--card) 94%, #fff) 0%, var(--card) 78%,
    color-mix(in oklab, var(--card) 88%, #000) 100%);
}
.fd .b,.fd .bf{
  bottom:0;border-radius:0 0 4px 4px;
  background:linear-gradient(180deg,
    color-mix(in oklab, var(--card-2) 86%, #000) 0%, var(--card-2) 30%,
    color-mix(in oklab, var(--card-2) 96%, #fff) 100%);
}
.fd .b > b,.fd .bf > b{transform:translateY(calc(var(--fh) / -2))}
.fd .tf{transform-origin:50% 100%;z-index:3;backface-visibility:hidden}
.fd .bf{transform-origin:50% 0;transform:rotateX(90deg);z-index:2;backface-visibility:hidden}
.fd .tf,.fd .bf{visibility:hidden}
.fd.go .tf{visibility:visible;animation:foldDown .26s cubic-bezier(.38,.04,.62,.42) forwards}
.fd.go .bf{visibility:visible;animation:foldUp .28s cubic-bezier(.2,.85,.4,1.03) .26s forwards}
.fd.go .tf > s{animation:shadeOn .26s cubic-bezier(.38,.04,.62,.42) forwards}
.fd.go .bf > s{animation:shadeOff .28s cubic-bezier(.2,.85,.4,1.03) .26s forwards}
@keyframes foldDown{to{transform:rotateX(-90deg)}}
@keyframes foldUp{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes shadeOn{from{opacity:0}to{opacity:.62}}
@keyframes shadeOff{from{opacity:.62}to{opacity:0}}
.fd::after{                                   /* 힌지: 가운데 틈 + 양 끝 축 자국 */
  content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;z-index:5;
  pointer-events:none;background:var(--bg);opacity:.62;
  box-shadow:inset 2px 0 0 -1px var(--card-edge), inset -2px 0 0 -1px var(--card-edge);
}
/* 넘김 효과 끔 — OS의 reduced-motion을 기본으로 따르되 앱에서 덮어쓸 수 있다 */
html.no-anim .fd.go .tf,html.no-anim .fd.go .bf{animation:none;visibility:hidden}

/* ── 히어로 ──────────────────────────── */
.hero{
  background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--hero,var(--rule-strong));
  border-radius:5px;padding:13px 15px 14px;display:flex;flex-direction:column;gap:10px;
}
.hero .lbl{
  font-family:var(--mono);font-size:.67rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.hero .row1{display:flex;align-items:flex-start;gap:14px}
.dblock{display:flex;align-items:center;gap:4px}
.dblock .dpre{                                /* 숫자 카드와 같은 크기·굵기로 맞춘다 */
  font-family:var(--mono);font-weight:700;font-size:var(--dsz,3.2rem);
  color:var(--hero,var(--ink));letter-spacing:-.05em;line-height:1;
}
.hero .who{flex:1;min-width:0;padding-top:2px}
.hero .who h1{
  margin:0;font-size:1.26rem;font-variation-settings:"wdth" 106,"wght" 720;
  letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero .who h1 a{color:inherit;text-decoration:none;border-bottom:1.5px solid var(--accent)}
.hero .who .kind{
  display:inline-block;font-family:var(--mono);font-size:.67rem;letter-spacing:.06em;
  padding:2px 6px;border-radius:2px;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:5px;
}
.hero .who .when{font-family:var(--mono);font-size:.9rem;color:var(--ink);margin-top:5px;font-weight:500}
.hero .who .when em{font-style:normal;color:var(--muted);font-weight:400;font-size:.82em}
.hero .rem{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero .remlbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.hero .meta{
  font-family:var(--mono);font-size:.75rem;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:3px 12px;border-top:1px dashed var(--rule);padding-top:9px;
}
.hero .cav{
  margin:0;font-size:.8rem;line-height:1.5;color:var(--ink-2);
  background:var(--surface-2);border-radius:3px;padding:6px 9px;
  border-left:2px solid var(--hero,var(--rule-strong));
}
.hero.none{border-left-color:var(--rule-strong);color:var(--muted);font-size:.85rem}

/* ── 관제탑 스택 ─────────────────────── */
.stack{display:flex;flex-direction:column;gap:5px}
.slot{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:9px 12px;position:relative;overflow:hidden;
}
.slot .gauge{position:absolute;left:0;top:0;bottom:0;width:var(--g,0%);background:var(--c);opacity:.065;pointer-events:none}
.slot .gauge::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.8}
.slot .dd{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:1.42rem;letter-spacing:-.04em;min-width:2.9ch;text-align:right;
  color:var(--c);font-weight:var(--w);
}
.slot .dd small{font-size:.54em;font-weight:600;opacity:.65;margin-right:1px}
.slot .info{min-width:0}
.slot .nm{
  font-size:.97rem;font-variation-settings:"wdth" 104,"wght" var(--w);color:var(--c);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot .sub{font-family:var(--mono);font-size:.79rem;color:var(--ink-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sub em{font-style:normal;color:var(--muted)}
.tchip.kr,.hero .meta b.kr{background:var(--kr-soft);color:var(--kr);border-color:var(--kr-line);font-weight:600;font-style:normal}
.hero .meta b.kr{padding:0 5px;border:1px solid var(--kr-line);border-radius:2px}
ul.all .t .d b.kr{color:var(--kr);font-weight:700}
.slot .tchip{
  font-family:var(--mono);font-size:.58rem;padding:0 4px;border-radius:2px;margin-left:6px;
  border:1px solid currentColor;opacity:.55;vertical-align:1px;
}
/* 우측 카운트다운 — 플립 없이 텍스트만 갱신해 8행이 동시에 돌아도 부담이 없다 */
.slot .cd{text-align:right;line-height:1.1;white-space:nowrap}
.slot .cd b{
  display:block;font-family:var(--mono);font-size:1.02rem;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--c);
}
.slot .cd i{
  display:block;font-style:normal;font-family:var(--mono);font-size:.56rem;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px;
}
.slot.est{border-style:dashed;background:transparent}

/* ── 섹션/목록 ───────────────────────── */
details.sect{border:1px solid var(--rule);border-radius:5px;background:var(--surface);overflow:hidden}
details.sect > summary{
  list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;
  font-size:.8rem;font-variation-settings:"wdth" 104,"wght" 640;color:var(--ink-2);
}
details.sect > summary::-webkit-details-marker{display:none}
details.sect > summary::before{content:"▸";color:var(--muted);font-size:.7rem;transition:transform .15s}
details.sect[open] > summary::before{transform:rotate(90deg)}
details.sect > summary .n{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.sect .body{padding:0 10px 10px;border-top:1px solid var(--rule)}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:9px 0}
.f{
  font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:100px;
  border:1px solid var(--rule-strong);color:var(--muted);
}
.f:hover{border-color:var(--accent);color:var(--accent)}
.f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.f.gold[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}
ul.all{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;
  max-height:46vh;overflow-y:auto;overscroll-behavior:contain}
ul.all li{display:flex;align-items:flex-start;gap:9px;padding:6px 4px;border-radius:3px}
ul.all li:hover{background:var(--surface-2)}
ul.all li.on{background:var(--accent-soft)}
ul.all input{margin:3px 0 0;accent-color:var(--accent);width:14px;height:14px;flex:none}
ul.all .t{min-width:0;flex:1}
ul.all .t .n{font-size:.87rem;font-variation-settings:"wdth" 102,"wght" 620;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.all .t .d{font-family:var(--mono);font-size:.73rem;color:var(--ink-2)}
ul.all .rt{font-family:var(--mono);font-size:.78rem;font-weight:600;color:var(--muted);
  text-align:right;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
ul.all li.past{opacity:.4}
.hint{font-size:.7rem;color:var(--muted);padding:7px 2px 0;line-height:1.5}
.wallcfg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 2px 2px;
  font-size:.72rem;color:var(--muted)}
.wallcfg label{display:flex;gap:6px;align-items:center}
.wallcfg label.grow{flex:1 1 150px}
.wallcfg select{font:inherit;font-size:.72rem;background:var(--surface);color:var(--ink);
  border:1px solid var(--rule-strong);border-radius:4px;padding:2px 4px}
.wallcfg input[type=range]{flex:1;min-width:80px;accent-color:var(--accent);height:16px}
.wallcfg b{font-family:var(--mono);font-size:.72rem;color:var(--ink-2);min-width:3.2ch;
  font-variant-numeric:tabular-nums}
/* 실제 화면 비율 그대로 축소한 미리보기. 창 크기에 따라 비율이 왜곡되는 걸 막는다 */
.wallprev{margin-top:10px}
.wallprev .screen{position:relative;width:100%;overflow:hidden;background:#080C0B;
  border:1px solid var(--rule-strong);border-radius:4px}
.wallprev iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none}
.wallprev .cap{font-family:var(--mono);font-size:.62rem;color:var(--muted);
  padding-top:5px;text-align:center;font-variant-numeric:tabular-nums}
.act{display:flex;gap:6px;flex-wrap:wrap;padding-top:9px}
.btn{
  font-size:.73rem;font-weight:600;padding:5px 11px;border-radius:4px;
  border:1px solid var(--rule-strong);color:var(--ink-2);background:var(--surface);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.foot{font-family:var(--mono);font-size:.6rem;color:var(--muted);text-align:center;padding-top:4px;letter-spacing:.02em}
.toast{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:.75rem;padding:7px 14px;border-radius:100px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;
}
.toast.show{opacity:1}

/* ── 배경화면 모드 ───────────────────── */
/* 배경화면 모드
   - Lively 는 스크롤이 불가능하므로 넘치면 잘린다 → 넘치는 슬롯은 JS가 떨궈낸다
   - ?pos= 로 화면 어느 구석에 붙일지, ?scale= 로 크기를 정한다
   - 모든 치수가 --u 배수라 scale 하나로 전체가 비례해 줄고 는다 */
body.wall{
  /* 치수 기준. vw 로 잡으면 화면 비율에 따라 크기가 달라져서
     3413x1440 같은 울트라와이드에서는 1vw 가 34px 이 되어 세로를 꽉 채운다.
     위젯은 어느 모니터에서든 같은 물리 크기여야 하고, 미리보기가
     실제 배경화면과 일치해야 하므로 고정 px 로 두고 --s 로만 조절한다. */
  --s:1;
  --u:calc(15px * var(--s));
  background:radial-gradient(120% 100% at 12% 0%,#12211F 0%,#080C0B 62%);
  background-size:cover;background-position:center;
  color:#E9F1EE;font-size:16px;overflow:hidden;
  display:flex;height:100vh;padding:2.6vh 2.4vw;
}
body.wall .app{
  max-width:none;width:auto;min-width:calc(var(--u)*34);max-width:calc(var(--u)*62);
  max-height:min(94vh, calc(var(--u) * 58));height:auto;margin:0;padding:0;
  gap:calc(var(--u)*.9);overflow:hidden;
}
body.wall.v-t{align-items:flex-start} body.wall.v-c{align-items:center} body.wall.v-b{align-items:flex-end}
body.wall.h-l{justify-content:flex-start} body.wall.h-c{justify-content:center} body.wall.h-r{justify-content:flex-end}
body.wall .bar{padding:0;flex:none}
body.wall .brand,body.wall .today{font-size:calc(var(--u)*.95)}
body.wall .brand{color:#7C918B;letter-spacing:.08em;text-transform:uppercase}
body.wall .iconbtn,body.wall details.sect,body.wall .toast{display:none}
body.wall .hero{flex:none;background:rgba(255,255,255,.028);border-color:rgba(255,255,255,.07);
  border-left-width:4px;padding:calc(var(--u)*1.1) calc(var(--u)*1.3);
  gap:calc(var(--u)*.8);border-radius:9px}
body.wall .hero .who h1{font-size:calc(var(--u)*2.6)}
body.wall .hero .who .when{font-size:calc(var(--u)*1.25)}
body.wall .hero .meta{font-size:calc(var(--u)*1)}
body.wall .hero .lbl,body.wall .hero .remlbl{font-size:calc(var(--u)*.85)}
body.wall .hero .who .kind{font-size:calc(var(--u)*.85)}
body.wall .hero .cav{font-size:calc(var(--u)*.95);background:rgba(255,255,255,.04);
  padding:calc(var(--u)*.55) calc(var(--u)*.8);line-height:1.45}
body.wall .stack{gap:calc(var(--u)*.38);flex:1 1 auto;min-height:0;overflow:hidden;align-content:flex-start}
body.wall .slot{background:rgba(255,255,255,.028);border-color:rgba(255,255,255,.06);
  padding:calc(var(--u)*.5) calc(var(--u)*.85);border-radius:7px;flex:none}
body.wall .slot .dd{font-size:calc(var(--u)*2);min-width:3.2ch}
body.wall .slot .nm{font-size:calc(var(--u)*1.25)}
body.wall .slot .sub{font-size:calc(var(--u)*1.02)}
body.wall .slot .cd b{font-size:calc(var(--u)*1.45)}
body.wall .slot .cd i{font-size:calc(var(--u)*.7)}
body.wall .foot{font-size:calc(var(--u)*.7);color:#5C6E69;flex:none}
body.wall{--card:#1B2624;--card-2:#141C1B;--card-edge:rgba(0,0,0,.6);--bg:#080C0B;
  --ink:#E9F1EE;--ink-2:#B4C4BF;--muted:#748883;--rule:rgba(255,255,255,.08);
  --hot:#FF6B62;--warm:#F0B45E;--cool:#8DA29C;--accent:#5CCFC0;--accent-ink:#8FE4D7;
  --accent-soft:rgba(92,207,192,.14);--surface:rgba(255,255,255,.03)}
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <span class="brand">Submission Runway</span>
    <span class="sp"></span>
    <span class="today" id="todayLbl"></span>
    <span id="clock" class="flipset" aria-label="현재 시각"></span>
    <button class="iconbtn" id="animBtn" title="넘김 효과" aria-pressed="false">⇵</button>
    <button class="iconbtn" id="secBtn" title="초 표시" aria-pressed="false">⋯</button>
    <button class="iconbtn" id="bellBtn" title="알림 권한">🔔</button>
  </div>

  <section class="hero" id="hero"></section>

  <div class="stack" id="stack"></div>

  <details class="sect" id="allSect">
    <summary>전체 학회 <span class="n" id="allN"></span></summary>
    <div class="body">
      <div class="filters" id="filters">
        <button class="f" data-k="field" data-v="all" aria-pressed="true">전체</button>
        <button class="f" data-k="field" data-v="robotics" aria-pressed="false">로보틱스</button>
        <button class="f" data-k="field" data-v="ml" aria-pressed="false">ML</button>
        <button class="f" data-k="field" data-v="vision" aria-pressed="false">비전</button>
        <button class="f" data-k="field" data-v="lang" aria-pressed="false">음성·NLP</button>
        <button class="f" data-k="field" data-v="med" aria-pressed="false">의료</button>
        <button class="f gold" data-k="t1" aria-pressed="false">T1만</button>
        <button class="f" data-k="conf" aria-pressed="false">확정만</button>
        <button class="f" data-k="past" aria-pressed="true">지난 마감 숨김</button>
      </div>
      <ul class="all" id="all"></ul>
      <div class="wallcfg">
        <label>목록
          <select id="wmode">
            <option value="pick">체크한 것</option>
            <option value="auto">자동 · 다가오는 순</option>
          </select>
        </label>
        <label>위치
          <select id="wpos">
            <option value="tl">↖ 좌상</option><option value="t">↑ 상단</option><option value="tr">↗ 우상</option>
            <option value="l">← 좌측</option><option value="c">· 중앙</option><option value="r">→ 우측</option>
            <option value="bl">↙ 좌하</option><option value="b">↓ 하단</option><option value="br">↘ 우하</option>
          </select>
        </label>
        <label class="grow">크기
          <input type="range" id="wscale" min="0.4" max="2.5" step="0.05" value="1">
          <b id="wscaleV">1.00</b>
        </label>
      </div>
      <div class="act">
        <button class="btn pri" id="copyWall">바탕화면 URL 복사</button>
        <button class="btn toggleprev" id="previewWall" aria-pressed="false">미리보기</button>
        <button class="btn" id="testNoti">알림 테스트</button>
        <button class="btn" id="resetSel">기본값으로</button>
      </div>
      <div class="wallprev" id="wallprev" hidden>
        <div class="screen" id="prevScreen"><iframe id="prevFrame" title="배경화면 미리보기" tabindex="-1"></iframe></div>
        <div class="cap" id="prevCap"></div>
      </div>
      <p class="hint">
        체크한 학회만 위에 표시되고 알림이 옵니다. 초록 마감이 남아 있으면 초록을, 지났으면 본문을 기준으로 셉니다.<br>
        배경화면(Lively)은 브라우저가 달라 체크 상태를 공유하지 못합니다 — 체크를 바꾼 뒤 <b>바탕화면 URL 복사</b>로 주소를 갱신하세요.
      </p>
    </div>
  </details>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const QS = new URLSearchParams(location.search);
const WALL = QS.get("mode") === "wall";
const KST = 9 * 60; // 분

let CONF = [], TOTAL = 0, SEL = new Set();
const LS = {
  sel: "cr.sel", noti: "cr.lastNoti", sec: "cr.sec", anim: "cr.anim", seen: "cr.seen", wpos: "cr.wpos", wsc: "cr.wsc", wmode: "cr.wmode",
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

/* ── 비트마스크 (idx 고정) ─────────────── */
function encodeSel(set){
  const b = new Uint8Array(Math.ceil(TOTAL / 8));
  for (const i of set) if (i < TOTAL) b[i >> 3] |= 1 << (i & 7);
  let s = ""; for (const x of b) s += String.fromCharCode(x);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeSel(str){
  const out = new Set();
  try {
    const s = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
    for (let i = 0; i < TOTAL; i++)
      if ((s.charCodeAt(i >> 3) | 0) & (1 << (i & 7))) out.add(i);
  } catch {}
  return out;
}

/* ── 플립 숫자 ─────────────────────────── */
function makeFlip(host, count, opt){
  host.innerHTML = "";
  host.style.setProperty("--fs", opt.fs);
  host.style.setProperty("--fw", opt.fw);
  host.style.setProperty("--fh", opt.fh);
  const cells = [];
  for (let i = 0; i < count; i++){
    if (opt.sepAt && opt.sepAt.includes(i)){
      const s = document.createElement("span");
      s.className = "sep"; s.textContent = ":";
      s.style.fontSize = opt.fs; host.appendChild(s);
    }
    const d = document.createElement("span");
    d.className = "fd";
    d.innerHTML = '<span class="c t"><b>0</b></span><span class="c b"><b>0</b></span>'
                + '<span class="c tf"><b>0</b><s></s></span><span class="c bf"><b>0</b><s></s></span>';
    host.appendChild(d);
    cells.push({ el: d, v: null,
      t: d.querySelector(".t b"), b: d.querySelector(".b b"),
      tf: d.querySelector(".tf b"), bf: d.querySelector(".bf b") });
  }
  return cells;
}
/* auto = OS 설정 따름 · on/off = 사용자가 명시적으로 덮어씀 */
const MQ_REDUCE = matchMedia("(prefers-reduced-motion: reduce)");
// Lively 등 다른 브라우저에서 띄울 때는 localStorage 를 공유하지 못하므로
// ?anim=1|0 으로도 강제할 수 있어야 한다. URL 이 있으면 그쪽이 우선.
const Q_ANIM = (v => v === "1" || v === "on" ? "on"
                   : v === "0" || v === "off" ? "off" : null)(QS.get("anim"));
let animPref = Q_ANIM ?? LS.get(LS.anim, "auto"), ANIM = true;
function applyAnim(){
  ANIM = animPref === "on" ? true : animPref === "off" ? false : !MQ_REDUCE.matches;
  document.documentElement.classList.toggle("no-anim", !ANIM);
}
applyAnim();
MQ_REDUCE.addEventListener?.("change", () => { if (animPref === "auto") applyAnim(); });

function setFlip(cells, text, color){
  const s = String(text);
  for (let i = 0; i < cells.length; i++){
    const c = cells[i], ch = s[i] ?? " ";
    if (color) c.el.style.setProperty("--fc", color);
    if (c.v === ch) continue;
    if (c.v === null || !ANIM){
      c.t.textContent = c.b.textContent = ch; c.v = ch; continue;
    }
    c.tf.textContent = c.v;      // 접혀 내려가는 옛 상단
    c.bf.textContent = ch;       // 펴져 올라오는 새 하단
    c.t.textContent = ch;        // 그 뒤에 드러날 새 상단
    c.el.classList.remove("go"); void c.el.offsetWidth; c.el.classList.add("go");
    c.v = ch;
    setTimeout(() => { c.b.textContent = ch; c.el.classList.remove("go"); }, 560);
  }
}

/* ── 임박도 → 색·굵기 ──────────────────── */
function hue(d){
  if (d <= 0) return { c: "var(--hot)", w: 900, g: 100 };
  const k = Math.max(0, Math.min(1, 1 - d / 90));          // 0(멀다) → 1(임박)
  const w = Math.round(400 + k * 500);
  const c = d <= 7 ? "var(--hot)"
          : d <= 30 ? `color-mix(in oklab, var(--hot) ${Math.round((30 - d) / 23 * 100)}%, var(--warm))`
          : d <= 60 ? `color-mix(in oklab, var(--warm) ${Math.round((60 - d) / 30 * 100)}%, var(--ink-2))`
          : "var(--cool)";
  return { c, w, g: Math.round(k * 100) };
}

/* ── 시간 계산 ─────────────────────────── */
const dayMs = 864e5;
function kstDate(ms){ return new Date(ms + (KST + new Date(ms).getTimezoneOffset()) * 6e4); }
function ddays(target, now){                       // 한국 날짜 기준 D-day
  const a = kstDate(target), b = kstDate(now);
  return Math.round((Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())
                   - Date.UTC(b.getFullYear(), b.getMonth(), b.getDate())) / dayMs);
}
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
function fmtKST(ms){
  const d = kstDate(ms), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}.${p(d.getDate())}<i>(${DOW[d.getDay()]})</i> ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtKSTplain(ms){                          // 알림 본문처럼 태그를 못 쓰는 곳
  const d = kstDate(ms), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}.${p(d.getDate())}(${DOW[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function kstKey(ms){                               // 한국 날짜 YYYY-MM-DD (알림 1일 1회 판정용)
  const d = kstDate(ms), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function hms(ms){                                  // D-day가 일을 세므로 하루 안의 시:분:초만
  const s = Math.max(0, Math.floor(ms / 1000)), p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(s / 3600) % 24)}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
function milestone(c, now){                        // 다음으로 닥친 관문
  const a = c.abs ? Date.parse(c.abs.at) : null, p = Date.parse(c.paper.at);
  if (a !== null && a > now) return { kind: "초록", at: a, meta: c.abs, other: p };
  if (p > now) return { kind: c.abs ? "본문" : "제출", at: p, meta: c.paper, other: null };
  return null;
}

/* ── 상태 ──────────────────────────────── */
const FLD = { robotics: "로보틱스", ml: "ML/DL", vision: "비전", lang: "음성·NLP", med: "의료영상" };
const tierTag = t => t === 0 ? '<b class="kr">국내</b>' : "T" + t;   // 국내 학회는 T 등급 대신 표기
let filters = { field: "all", t1: false, conf: false, past: true };
let heroCells = null, remCells = null, clockCells = null, heroId = null, stackCd = [];
let showSec = LS.get(LS.sec, "0") === "1";

function defaults(){ return new Set(CONF.filter(c => c.def).map(c => c.idx)); }

/* s=auto — 고정 목록 대신 규칙으로 고른다. 마감이 지나면 알아서 빠지고
   새 학회가 들어오므로 배경화면 URL 을 다시 등록할 일이 없다.
   tier=0123 · days=N · est=1 · field=robotics,ml 로 조건을 좁힐 수 있다. */
let AUTO = false;
const AUTO_CFG = {
  tiers: (QS.get("tier") || "0123").split("").filter(x => /\d/.test(x)).map(Number),
  days:  Math.max(0, parseInt(QS.get("days") || "0", 10) || 0),   // 0 = 제한 없음
  est:   QS.get("est") === "1",
  flds:  (QS.get("field") || "").split(",").map(x => x.trim()).filter(Boolean),
  all:   QS.get("all") === "1",                                    // 커밋·저널 트랙까지 포함
};
function autoOK(c, now){
  if (c.skip && !AUTO_CFG.all) return false;        // 신규 투고 마감이 아닌 항목
  if (c.est && !AUTO_CFG.est) return false;
  if (!AUTO_CFG.tiers.includes(c.tier)) return false;
  if (AUTO_CFG.flds.length && !AUTO_CFG.flds.includes(c.field)) return false;
  const m = milestone(c, now);
  if (!m) return false;
  if (AUTO_CFG.days && ddays(m.at, now) > AUTO_CFG.days) return false;
  return true;
}

function checked(now){
  return CONF.filter(c => AUTO ? autoOK(c, now) : SEL.has(c.idx))
    .map(c => ({ c, m: milestone(c, now) }))
    .filter(x => x.m)
    .sort((a, b) => a.m.at - b.m.at);
}

/* ── 렌더 ──────────────────────────────── */
function renderHero(list, now){
  const host = document.getElementById("hero");
  if (!list.length){
    host.className = "hero none"; host.innerHTML = "추적 중인 마감이 없습니다. 아래에서 학회를 체크하세요.";
    heroCells = remCells = heroId = null; return;
  }
  const { c, m } = list[0];
  const d = ddays(m.at, now), h = hue(d);
  const dw = d >= 100 ? 3 : d >= 10 ? 2 : 1;       // 자릿수가 바뀔 때만 재생성
  if (heroId !== c.id + m.kind + dw){
    heroId = c.id + m.kind + dw;
    host.className = "hero";
    host.innerHTML = `
      <div class="lbl">다음 마감</div>
      <div class="row1">
        <span class="dblock"><span class="dpre">D-</span><span class="flipset" id="heroF"></span></span>
        <div class="who">
          <span class="kind">${m.kind}${c.est ? " · 예상" : ""}</span>
          <h1><a href="${c.url}" target="_blank" rel="noopener">${c.name}</a></h1>
          <div class="when">${fmtKST(m.at)} <em>KST</em> · <em>원 표기</em> ${m.meta.label}${m.meta.sure ? "" : " ?"}</div>
        </div>
      </div>
      <div class="rem"><span class="remlbl">남은 시간</span><span class="flipset" id="remF"></span></div>
      <div class="meta">
        <span>${tierTag(c.tier)}</span><span>${FLD[c.field]}</span><span>${c.pages}</span><span>${c.pub}</span><span>${c.venue}</span>
      </div>
      ${c.note ? `<p class="cav">${c.note}</p>` : ""}`;
    heroCells = makeFlip(document.getElementById("heroF"), dw,
      { fs: WALL ? "calc(var(--u)*4.2)" : "3.2rem", fw: WALL ? "calc(var(--u)*3.35)" : "2.55rem",
        fh: WALL ? "calc(var(--u)*5.4)" : "4.15rem" });
    host.style.setProperty("--dsz", WALL ? "calc(var(--u)*4.2)" : "3.2rem");   // "D-"를 숫자와 동일 크기로
    remCells = makeFlip(document.getElementById("remF"), 6,
      { fs: WALL ? "calc(var(--u)*2.15)" : "1.8rem", fw: WALL ? "calc(var(--u)*1.45)" : "1.2rem",
        fh: WALL ? "calc(var(--u)*3.05)" : "2.5rem", sepAt: [2, 4] });
  }
  host.style.setProperty("--hero", h.c);
  setFlip(heroCells, String(Math.min(999, Math.max(0, d))).padStart(dw, "0"), h.c);
  // D-day가 일(日)을 이미 표시하므로, 카운트다운은 하루 안의 시:분:초만 센다
  const left = Math.max(0, m.at - now), s = Math.floor(left / 1000);
  const hh = Math.floor(s / 3600) % 24, mm = Math.floor(s / 60) % 60, ss = s % 60;
  const p = n => String(n).padStart(2, "0");
  setFlip(remCells, p(hh) + p(mm) + p(ss), h.c);
}

function renderStack(list, now){
  const host = document.getElementById("stack");
  const rows = list.slice(1, WALL ? 9 : 8);
  host.innerHTML = rows.map(({ c, m }) => {
    const d = ddays(m.at, now), h = hue(d);
    return `<div class="slot${c.est ? " est" : ""}" style="--c:${h.c};--w:${h.w};--g:${h.g}%">
      <span class="gauge"></span>
      <span class="dd"><small>D-</small>${d}</span>
      <div class="info">
        <div class="nm">${c.name}<span class="tchip${c.tier===0?" kr":""}">${c.tier===0?"국내":"T"+c.tier}</span></div>
        <div class="sub">${m.kind} <strong>${fmtKST(m.at)}</strong> <em>KST${c.est ? " · 예상" : ""}</em></div>
      </div>
      <div class="cd"><b data-at="${m.at}">${hms(m.at - now)}</b><i>남은 시간</i></div>
    </div>`;
  }).join("");
  stackCd = [...host.querySelectorAll(".cd b")];
  // 배경화면은 스크롤이 안 되므로, 화면을 넘치는 슬롯은 잘리기 전에 떨궈낸다
  if (WALL) requestAnimationFrame(() => {
    let guard = 40;
    while (host.scrollHeight > host.clientHeight + 1 && host.lastElementChild && guard--)
      host.removeChild(host.lastElementChild);
  });
}

function renderAll(now){
  const ul = document.getElementById("all");
  const vis = CONF.filter(c => {
    if (filters.field !== "all" && c.field !== filters.field) return false;
    if (filters.t1 && c.tier !== 1) return false;
    if (filters.conf && c.est) return false;
    if (filters.past && !milestone(c, now)) return false;
    return true;
  }).sort((a, b) => Date.parse(a.paper.at) - Date.parse(b.paper.at));
  document.getElementById("allN").textContent = `${vis.length} / ${TOTAL}`;
  ul.innerHTML = vis.map(c => {
    const m = milestone(c, now);
    const d = m ? ddays(m.at, now) : null;
    const on = SEL.has(c.idx);
    return `<li class="${on ? "on " : ""}${m ? "" : "past"}">
      <input type="checkbox" data-i="${c.idx}" ${on ? "checked" : ""} id="cb${c.idx}">
      <label class="t" for="cb${c.idx}">
        <div class="n">${c.name}</div>
        <div class="d">${tierTag(c.tier)} · ${c.est ? "예상" : "확정"} · ${m ? m.kind + " " + fmtKST(m.at) : "종료"}</div>
      </label>
      <span class="rt">${m ? "D-" + d : "—"}</span>
    </li>`;
  }).join("");
}

function renderClock(now){
  const d = kstDate(now), p = n => String(n).padStart(2, "0");
  document.getElementById("todayLbl").innerHTML =
    `${p(d.getMonth() + 1)}.${p(d.getDate())} <b>${DOW[d.getDay()]}</b>`;
  const txt = p(d.getHours()) + p(d.getMinutes()) + (showSec ? p(d.getSeconds()) : "");
  const need = showSec ? 6 : 4;
  if (!clockCells || clockCells.length !== need){
    clockCells = makeFlip(document.getElementById("clock"), need,
      { fs: WALL ? "calc(var(--u)*1.15)" : ".78rem", fw: WALL ? "calc(var(--u)*.85)" : ".58rem",
        fh: WALL ? "calc(var(--u)*1.8)" : "1.2rem", sepAt: showSec ? [2, 4] : [2] });
  }
  setFlip(clockCells, txt, "var(--ink-2)");
}

function tick(){
  const now = Date.now();
  const list = checked(now);
  renderHero(list, now);
  renderClock(now);
  for (const el of stackCd) el.textContent = hms(+el.dataset.at - now);
  if (tick.day !== new Date(now).getDate()){
    tick.day = new Date(now).getDate();
    renderStack(list, now);
    if (!WALL) renderAll(now);
    badge(list, now);
  }
  const foot = document.getElementById("foot");
  foot.textContent = `${list.length}건 추적 · 데이터 ${window.__ver ?? ""}`;
  if (QS.get("debug") === "1"){
    const u = getComputedStyle(document.body).getPropertyValue("--u").trim();
    foot.textContent += ` · 뷰포트 ${innerWidth}×${innerHeight} · DPR ${devicePixelRatio}`
      + ` · --u ${u} · 슬롯 ${document.querySelectorAll(".slot").length}`
      + ` · anim ${ANIM ? "on" : "off"}(${animPref}) · reduce ${MQ_REDUCE.matches}`
      + (AUTO ? ` · auto tier=${AUTO_CFG.tiers.join("")} days=${AUTO_CFG.days || "∞"} est=${AUTO_CFG.est}` : "");
  }
}

/* ── 알림 ──────────────────────────────── */
const WIN = { 1: [60, 30, 14, 7, 3, 1, 0], 2: [30, 14, 7, 1], 3: [14, 3] };
function due(list, now){
  return list.filter(({ c, m }) => {
    const d = ddays(m.at, now);
    return (c.est ? [45] : WIN[c.tier]).includes(d);
  });
}
function badge(list, now){
  const n = list.filter(({ m }) => ddays(m.at, now) <= 30).length;
  try { n ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.(); } catch {}
  document.title = list.length ? `D-${ddays(list[0].m.at, now)} ${list[0].c.name}` : "Submission Runway";
}
function notify(force){
  if (WALL || !("Notification" in window) || Notification.permission !== "granted") return;
  const now = Date.now(), list = checked(now), hit = due(list, now);
  const today = kstKey(now);
  if (!force){
    if (!hit.length) return;
    if (LS.get(LS.noti, "") === today) return;
    LS.set(LS.noti, today);
  }
  const src = (force ? list : hit).slice(0, 6);
  if (!src.length) return;
  const body = src.map(({ c, m }) =>
    `${c.name} ${m.kind} D-${ddays(m.at, now)} · ${fmtKSTplain(m.at)} KST`).join("\n");
  const n = new Notification(`마감 임박 ${src.length}건`, { body, tag: "conf-radar", icon: "./icon-192.png", requireInteraction: false });
  n.onclick = () => { window.focus(); n.close(); };
}

/* ── UI 배선 ───────────────────────────── */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove("show"), 1900);
}
function saveSel(){ LS.set(LS.sel, encodeSel(SEL)); }

function wire(){
  document.getElementById("all").addEventListener("change", e => {
    const i = +e.target.dataset.i;
    if (Number.isNaN(i)) return;
    e.target.checked ? SEL.add(i) : SEL.delete(i);
    saveSel(); queuePreview(); const now = Date.now(); const l = checked(now);
    renderHero(l, now); renderStack(l, now); renderAll(now); badge(l, now);
  });
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest(".f"); if (!b) return;
    if (b.dataset.k === "field"){
      filters.field = b.dataset.v;
      document.querySelectorAll('.f[data-k="field"]').forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    } else {
      filters[b.dataset.k] = !filters[b.dataset.k];
      b.setAttribute("aria-pressed", String(filters[b.dataset.k]));
    }
    renderAll(Date.now());
  });
  const wmode = document.getElementById("wmode");
  const wpos = document.getElementById("wpos"), wsc = document.getElementById("wscale"),
        wscV = document.getElementById("wscaleV");
  wmode.value = LS.get(LS.wmode, "pick");
  wmode.onchange = () => { LS.set(LS.wmode, wmode.value); queuePreview(); };
  wpos.value = LS.get(LS.wpos, "tl");
  wsc.value  = LS.get(LS.wsc, "1");
  const paintScale = () => wscV.textContent = (+wsc.value).toFixed(2);
  paintScale();
  wpos.onchange = () => { LS.set(LS.wpos, wpos.value); queuePreview(); };
  wsc.oninput   = () => { paintScale(); LS.set(LS.wsc, wsc.value); queuePreview(); };

  // pos·scale 을 빼먹으면 배경화면에서 기본 크기로 커져버린다. 항상 붙인다.
  const wallURL = () => `${location.origin}${location.pathname}`
    + `?mode=wall&pos=${wpos.value}&scale=${(+wsc.value).toFixed(2)}`
    + `&anim=${ANIM ? 1 : 0}`
    + `&s=${wmode.value === "auto" ? "auto" : encodeSel(SEL)}`;

  document.getElementById("copyWall").onclick = async () => {
    const u = wallURL();
    try { await navigator.clipboard.writeText(u); toast("바탕화면 URL을 복사했습니다"); }
    catch { prompt("아래 주소를 복사하세요", u); }
  };
  // 새 탭 미리보기는 창 크기가 실제 화면과 달라 비율이 왜곡된다.
  // 실제 화면 해상도(screen.width/height)만큼 iframe 을 만들고 통째로 축소해서 보여준다.
  const prevBox = document.getElementById("wallprev"),
        prevScr = document.getElementById("prevScreen"),
        prevFr  = document.getElementById("prevFrame"),
        prevCap = document.getElementById("prevCap"),
        prevBtn = document.getElementById("previewWall");
  let prevOn = false, prevT = 0;

  function drawPreview(){
    if (!prevOn) return;
    const sw = screen.width || 1920, sh = screen.height || 1080;
    const w = prevScr.clientWidth || 400, k = w / sw;
    prevScr.style.height = Math.round(sh * k) + "px";
    prevFr.style.width = sw + "px";
    prevFr.style.height = sh + "px";
    prevFr.style.transform = `scale(${k})`;
    prevFr.src = wallURL();
    prevCap.textContent = `실제 화면 ${sw}×${sh} 기준 · ${(k * 100).toFixed(1)}% 축소`;
  }
  const queuePreview = () => { clearTimeout(prevT); prevT = setTimeout(drawPreview, 260); };

  prevBtn.onclick = () => {
    prevOn = !prevOn;
    prevBox.hidden = !prevOn;
    prevBtn.setAttribute("aria-pressed", String(prevOn));
    if (prevOn) drawPreview(); else prevFr.removeAttribute("src");   // 꺼두면 타이머도 멈춘다
  };
  addEventListener("resize", queuePreview);
  document.getElementById("testNoti").onclick = async () => {
    if (Notification.permission !== "granted"){
      const p = await Notification.requestPermission();
      if (p !== "granted") return toast("알림 권한이 거부되었습니다");
    }
    notify(true); toast("알림을 보냈습니다");
  };
  document.getElementById("resetSel").onclick = () => {
    SEL = defaults(); saveSel();
    const now = Date.now(), l = checked(now);
    renderHero(l, now); renderStack(l, now); renderAll(now); badge(l, now);
    toast("기본 13건으로 되돌렸습니다");
  };
  const sb = document.getElementById("secBtn");
  sb.setAttribute("aria-pressed", String(showSec));
  sb.onclick = () => {
    showSec = !showSec; LS.set(LS.sec, showSec ? "1" : "0");
    sb.setAttribute("aria-pressed", String(showSec));
    clockCells = null; renderClock(Date.now());
  };
  const ab = document.getElementById("animBtn");
  const paintAnim = () => {
    ab.setAttribute("aria-pressed", String(ANIM));
    ab.title = `넘김 효과 ${ANIM ? "켜짐" : "꺼짐"}` +
      (animPref === "auto" ? " (시스템 설정 따름)" : " (직접 설정)");
  };
  paintAnim();
  ab.onclick = () => {
    animPref = ANIM ? "off" : "on";          // 한 번 누르면 시스템 설정을 덮어쓴다
    LS.set(LS.anim, animPref); applyAnim(); paintAnim(); queuePreview();
    toast(ANIM ? "종이 넘김 효과를 켰습니다" : "넘김 효과를 껐습니다");
  };

  const bb = document.getElementById("bellBtn");
  const paint = () => bb.style.opacity = Notification?.permission === "granted" ? "1" : ".45";
  paint();
  bb.onclick = async () => {
    if (!("Notification" in window)) return toast("이 브라우저는 알림을 지원하지 않습니다");
    const p = await Notification.requestPermission(); paint();
    toast(p === "granted" ? "알림이 켜졌습니다" : "알림 권한이 거부되었습니다");
  };
}

/* ── 부팅 ──────────────────────────────── */
(async function boot(){
  if (WALL){
    document.body.classList.add("wall");
    // ?pos=tl|t|tr|l|c|r|bl|b|br  (기본 tl) · ?scale=0.4~2.0 · ?bg=이미지 경로
    const pos = (QS.get("pos") || "tl").toLowerCase();
    const v = /t/.test(pos) ? "t" : /b/.test(pos) ? "b" : "c";
    const h = /l/.test(pos) ? "l" : /r/.test(pos) ? "r" : "c";
    document.body.classList.add("v-" + v, "h-" + h);
    const sc = parseFloat(QS.get("scale"));
    if (sc > 0) document.body.style.setProperty("--s", String(Math.min(3, Math.max(.4, sc))));
    const bg = QS.get("bg");
    if (bg) document.body.style.backgroundImage =
      `linear-gradient(rgba(6,10,9,.55),rgba(6,10,9,.72)), url("${encodeURI(bg)}")`;
  }
  const res = await fetch("./conferences.json", { cache: "no-cache" });
  const data = await res.json();
  CONF = data.conferences; TOTAL = CONF.length; window.__ver = data.version;

  const fromUrl = QS.get("s");
  AUTO = fromUrl === "auto";
  SEL = AUTO ? new Set()
       : fromUrl ? decodeSel(fromUrl)
       : (LS.get(LS.sel, null) !== null ? decodeSel(LS.get(LS.sel, "")) : defaults());
  if (!fromUrl && LS.get(LS.sel, null) === null) saveSel();

  // 저장소에 새로 추가된 학회 중 def:true 인 것은 자동으로 체크해 준다.
  // 이게 없으면 이미 선택을 저장해 둔 사람에게는 새 학회가 영영 안 뜬다.
  if (!fromUrl){
    const seen = parseInt(LS.get(LS.seen, "-1"), 10);
    const fresh = CONF.filter(c => c.idx > seen && c.def);
    if (fresh.length){ fresh.forEach(c => SEL.add(c.idx)); saveSel(); }
    LS.set(LS.seen, String(TOTAL - 1));
  }

  const now = Date.now(), list = checked(now);
  renderHero(list, now); renderStack(list, now); renderClock(now); badge(list, now);
  if (!WALL){
    renderAll(now); wire();
    document.getElementById("allSect").open = !list.length;
    setTimeout(() => notify(false), 1200);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  tick.day = new Date(now).getDate();
  setInterval(tick, 1000);
  setInterval(() => {                       // 자정 넘김 대비 재계산
    const n = Date.now(), l = checked(n);
    renderStack(l, n); if (!WALL) renderAll(n); badge(l, n); notify(false);
  }, 60000);
})();
</script>
